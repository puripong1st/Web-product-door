<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการอุปกรณ์โปรเจกต์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .animate-pulse-fast { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">รายการสั่งซื้ออุปกรณ์ (Hardware Checklist)</h1>
        
        <div id="productList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- สินค้าจะถูก Render ที่นี่ -->
        </div>
    </div>

    <!-- แถบสรุปราคาด้านล่าง -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] border-t border-gray-200 py-4 px-6 z-50">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-lg">
                <span>ราคารวมทั้งหมด: </span>
                <span id="totalBudget" class="font-bold text-gray-800">0</span> <span>บาท</span>
            </div>
            <div class="text-lg">
                <span>ซื้อไปแล้ว: </span>
                <span id="totalBought" class="font-bold text-green-600">0</span> <span>บาท</span>
            </div>
            <div class="text-xl">
                <span>ยอดที่ต้องจ่ายเพิ่ม: </span>
                <span id="totalRemaining" class="font-bold text-red-600">0</span> <span>บาท</span>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลสินค้า (เพิ่ม fixedImage สำหรับอันที่ดึงอัตโนมัติไม่ผ่าน)
        const products = [
            { id: 1, name: "Raspberry Pi 4 Model B 4GB Starter Kit", price: 5153, link: "https://th.cytron.io/p-raspberry-pi-4-4GB-starter-kit", bought: false },
            { id: 2, name: "ESP32 Development Board", price: 139, link: "https://shopee.co.th/product/38626007/4317240047", bought: false, fixedImage: "https://th.cytron.io/image/cache/catalog/products/NODE-ESP-32S/NODE-ESP-32S-1-800x800.jpg" },
            { id: 3, name: "Relay Module 1-channel", price: 29, link: "https://th.cytron.io/p-1ch-active-h-l-5v-optocoupler-relay-module", bought: false },
            { id: 4, name: "Solenoid Door Lock 12VDC", price: 135, link: "https://shopee.co.th/product/38626007/2756036884", bought: false, fixedImage: "https://th.cytron.io/image/cache/catalog/products/S-LOCK-12/S-LOCK-12-1-800x800.jpg" },
            { id: 5, name: "Reed Switch Door Sensor MC-38", price: 25, link: "https://shopee.co.th/product/459630043/10038823481", bought: false, fixedImage: "https://th.cytron.io/image/cache/catalog/products/SN-M-DS-MC38/SN-M-DS-MC38-1-800x800.jpg" },
            { id: 6, name: "Active Buzzer 5V", price: 14, link: "https://www.allnewstep.com/product/3609", bought: false },
            { id: 7, name: "LED 5mm (แพ็ค 30 หลอด)", price: 25, link: "https://www.allnewstep.com/product/1909", bought: false },
            { id: 8, name: "ตัวต้านทาน 330 โอห์ม (10 ชิ้น)", price: 5, link: "https://www.allnewstep.com/product/1014", bought: false },
            { id: 9, name: "Push Button กันน้ำ", price: 30, link: "https://www.allnewstep.com/product/3631", bought: false },
            { id: 10, name: "Adapter 12V 2A", price: 200, link: "https://shopee.co.th/product/666928375/22157830260", bought: false, fixedImage: "https://th.cytron.io/image/cache/catalog/products/AC-DC-12-2A/AC-DC-12-2A-1-800x800.jpg" },
            { id: 11, name: "Step-Down Module 12V to 5V", price: 25, link: "https://th.cytron.io/p-lm2596-3a-step-down-converter", bought: false },
            { id: 12, name: "กล่องพลาสติก ABS", price: 230, link: "https://www.rbc-rubicon.com", bought: false },
            { id: 13, name: "สายไฟ Jumper", price: 29, link: "https://th.cytron.io/p-40-way-20cm-dupont-jumper-wire", bought: false },
            { id: 14, name: "Perfboard / PCB 5×7cm (5 แผ่น)", price: 28, link: "https://shopee.co.th/product/139632720/25266688597", bought: false, fixedImage: "https://th.cytron.io/image/cache/catalog/products/PCB-5X7/PCB-5X7-1-800x800.jpg" },
            { id: 15, name: "ตัวต้านทาน 10kΩ (รวม 600 ชิ้น)", price: 45, link: "https://www.allnewstep.com/product/751", bought: false }
        ];

        const productListEl = document.getElementById('productList');

        function updateTotals() {
            let totalBudget = 0;
            let totalBought = 0;

            products.forEach(p => {
                totalBudget += p.price;
                if (p.bought) totalBought += p.price;
            });

            document.getElementById('totalBudget').innerText = totalBudget.toLocaleString();
            document.getElementById('totalBought').innerText = totalBought.toLocaleString();
            document.getElementById('totalRemaining').innerText = (totalBudget - totalBought).toLocaleString();
        }

        function toggleBuy(id) {
            const index = products.findIndex(p => p.id === id);
            if (index !== -1) {
                products[index].bought = !products[index].bought;
                updateTotals();
                
                const card = document.getElementById(`card-${id}`);
                const toggleBg = document.getElementById(`toggle-bg-${id}`);
                const toggleDot = document.getElementById(`toggle-dot-${id}`);
                const statusText = document.getElementById(`status-text-${id}`);
                const boughtOverlay = document.getElementById(`overlay-${id}`);

                if (products[index].bought) {
                    card.classList.add('opacity-60', 'bg-green-50');
                    toggleBg.classList.replace('bg-gray-300', 'bg-green-500');
                    toggleDot.classList.add('translate-x-4');
                    statusText.innerText = 'ซื้อแล้ว';
                    statusText.classList.replace('text-gray-500', 'text-green-600');
                    boughtOverlay.classList.remove('hidden');
                } else {
                    card.classList.remove('opacity-60', 'bg-green-50');
                    toggleBg.classList.replace('bg-green-500', 'bg-gray-300');
                    toggleDot.classList.remove('translate-x-4');
                    statusText.innerText = 'ยังไม่ซื้อ';
                    statusText.classList.replace('text-green-600', 'text-gray-500');
                    boughtOverlay.classList.add('hidden');
                }
            }
        }

        function initRender() {
            productListEl.innerHTML = '';
            
            products.forEach(p => {
                const card = document.createElement('div');
                card.id = `card-${p.id}`;
                card.className = `bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 transition-all duration-300 hover:shadow-lg`;
                
                card.innerHTML = `
                    <div class="h-48 overflow-hidden relative bg-white border-b">
                        <div id="loading-${p.id}" class="w-full h-full flex items-center justify-center animate-pulse-fast bg-gray-100 text-gray-400">
                            กำลังดึงภาพ...
                        </div>
                        <img id="img-${p.id}" src="" alt="${p.name}" class="w-full h-full object-contain p-2 hidden">
                        
                        <div id="overlay-${p.id}" class="hidden absolute inset-0 bg-green-500 bg-opacity-20 flex items-center justify-center z-10">
                            <span class="bg-green-600 text-white px-3 py-1 rounded-full text-sm font-semibold shadow">ซื้อแล้ว</span>
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="font-semibold text-gray-800 line-clamp-2 h-12 mb-2 leading-tight">${p.name}</h3>
                        <div class="text-xl font-bold text-blue-600 mb-4">฿${p.price.toLocaleString()}</div>
                        
                        <div class="flex items-center justify-between mt-4 border-t pt-4">
                            <a href="${p.link}" target="_blank" rel="noopener noreferrer" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-3 rounded font-medium transition-colors">
                                🛒 ดูที่ร้าน
                            </a>
                            
                            <label class="flex items-center cursor-pointer">
                                <div class="relative">
                                    <input type="checkbox" id="check-${p.id}" class="sr-only" onchange="toggleBuy(${p.id})">
                                    <div id="toggle-bg-${p.id}" class="block w-10 h-6 rounded-full transition-colors bg-gray-300"></div>
                                    <div id="toggle-dot-${p.id}" class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 shadow-sm"></div>
                                </div>
                                <span id="status-text-${p.id}" class="ml-2 text-xs font-medium text-gray-500 w-12 text-right">
                                    ยังไม่ซื้อ
                                </span>
                            </label>
                        </div>
                    </div>
                `;
                productListEl.appendChild(card);
            });

            updateTotals();
        }

        async function fetchImagesDynamically() {
            for (const p of products) {
                const imgEl = document.getElementById(`img-${p.id}`);
                const loadingEl = document.getElementById(`loading-${p.id}`);
                
                // ตรวจสอบว่ามีการใส่ลิงก์รูปแบบเจาะจงไว้หรือไม่ (เช่น ของ Shopee)
                if (p.fixedImage) {
                    imgEl.src = p.fixedImage;
                    imgEl.onload = () => {
                        loadingEl.classList.add('hidden');
                        imgEl.classList.remove('hidden');
                    };
                    continue; // ข้ามไปทำรายการถัดไปเลย ไม่ต้องยิง API
                }

                // สำหรับเว็บอื่นๆ ให้ใช้ API ดึงปกติ
                try {
                    const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(p.link)}`);
                    const data = await response.json();
                    
                    if (data.status === 'success' && data.data.image && data.data.image.url) {
                        imgEl.src = data.data.image.url;
                    } else {
                        imgEl.src = `https://placehold.co/400x300/f1f5f9/64748b?text=No+Image`;
                    }
                } catch (error) {
                    imgEl.src = `https://placehold.co/400x300/fee2e2/ef4444?text=Error`;
                }

                imgEl.onload = () => {
                    loadingEl.classList.add('hidden');
                    imgEl.classList.remove('hidden');
                };
                
                imgEl.onerror = () => {
                    imgEl.src = `https://placehold.co/400x300/f1f5f9/64748b?text=Image+Error`;
                    loadingEl.classList.add('hidden');
                    imgEl.classList.remove('hidden');
                }

                await new Promise(r => setTimeout(r, 200));
            }
        }

        initRender();
        fetchImagesDynamically();

    </script>
</body>
</html>
