<!-- Firebase SDK (ใช้ Type Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        // นำเข้าโมดูล Database ของ Firebase
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        // 🔴 นำ Config ของ Firebase มาวางทับตรงนี้ 🔴
       const firebaseConfig = {
        apiKey: "AIzaSyAD9BCcPzh_umMQyjLyNlGDLglolN8Hil8",
        authDomain: "web-produtcs.firebaseapp.com",
        projectId: "web-produtcs",
        storageBucket: "web-produtcs.firebasestorage.app",
        messagingSenderId: "631567218716",
        appId: "1:631567218716:web:ffe54bbae5c02272b9c7d9"
      };

        const app = initializeApp(firebaseConfig);
        // ประกาศเรียกใช้ Database
        const db = getDatabase(app);
        const dbRef = ref(db, 'hardwareProject/products');

        let products = [];
        const productListEl = document.getElementById('productList');

        const defaultProducts = [
            { id: 1, name: "Raspberry Pi 4 Model B 4GB Starter Kit", price: 5153, link: "https://th.cytron.io/p-raspberry-pi-4-4GB-starter-kit", bought: false },
            { id: 2, name: "ESP32 Development Board", price: 139, link: "https://shopee.co.th/product/38626007/4317240047", bought: false, fixedImage: "https://th.cytron.io/image/cache/catalog/products/NODE-ESP-32S/NODE-ESP-32S-1-800x800.jpg" }
        ];

        // ฟังก์ชันบันทึกขึ้น Firebase
        function syncToFirebase(data) {
            set(dbRef, data);
        }

        // ดึงข้อมูล Real-time ทันทีที่มีคนอัปเดต
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                products = data;
            } else {
                products = defaultProducts;
                syncToFirebase(products);
            }
            initRender();
            fetchImagesDynamically();
        });

        window.addNewProduct = function() {
            const nameInput = document.getElementById('newName');
            const priceInput = document.getElementById('newPrice');
            const linkInput = document.getElementById('newLink');
            const imageInput = document.getElementById('newImage');

            const name = nameInput.value.trim();
            const price = parseFloat(priceInput.value);
            const link = linkInput.value.trim() || "#";
            const image = imageInput.value.trim();

            if (!name || isNaN(price)) return alert("กรุณากรอกชื่อและราคาให้ครบครับ");

            const newProduct = { id: Date.now(), name, price, link, bought: false };
            if (image) newProduct.fixedImage = image;

            let currentProducts = products || [];
            currentProducts.push(newProduct);
            syncToFirebase(currentProducts);

            nameInput.value = ''; priceInput.value = ''; linkInput.value = ''; imageInput.value = '';
        };

        window.deleteProduct = function(id) {
            if(confirm("ต้องการลบอุปกรณ์นี้ใช่หรือไม่?")) {
                const updatedProducts = products.filter(p => p.id !== id);
                syncToFirebase(updatedProducts);
            }
        };

        window.toggleBuy = function(id) {
            const updatedProducts = [...products];
            const index = updatedProducts.findIndex(p => p.id === id);
            if (index !== -1) {
                updatedProducts[index].bought = !updatedProducts[index].bought;
                syncToFirebase(updatedProducts);
            }
        };

        function updateTotals() {
            let totalBudget = 0; let totalBought = 0;
            if(products) {
                products.forEach(p => {
                    totalBudget += p.price;
                    if (p.bought) totalBought += p.price;
                });
            }
            document.getElementById('totalBudget').innerText = totalBudget.toLocaleString();
            document.getElementById('totalBought').innerText = totalBought.toLocaleString();
            document.getElementById('totalRemaining').innerText = (totalBudget - totalBought).toLocaleString();
        }

        function initRender() {
            productListEl.innerHTML = '';
            if(!products) return;
            
            products.forEach(p => {
                const card = document.createElement('div');
                card.id = `card-${p.id}`;
                const isBoughtBg = p.bought ? 'opacity-60 bg-green-50' : '';
                card.className = `bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 transition-all duration-300 hover:shadow-lg relative group ${isBoughtBg}`;
                
                card.innerHTML = `
                    <button onclick="window.deleteProduct(${p.id})" class="absolute top-2 right-2 z-20 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-600 shadow">✕</button>
                    <div class="h-48 overflow-hidden relative bg-white border-b">
                        <div id="loading-${p.id}" class="w-full h-full flex items-center justify-center animate-pulse-fast bg-gray-100 text-gray-400">กำลังดึงภาพ...</div>
                        <img id="img-${p.id}" src="" alt="${p.name}" class="w-full h-full object-contain p-2 hidden">
                        <div id="overlay-${p.id}" class="${p.bought ? '' : 'hidden'} absolute inset-0 bg-green-500 bg-opacity-20 flex items-center justify-center z-10">
                            <span class="bg-green-600 text-white px-3 py-1 rounded-full text-sm font-semibold shadow">ซื้อแล้ว</span>
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="font-semibold text-gray-800 line-clamp-2 h-12 mb-2 leading-tight">${p.name}</h3>
                        <div class="text-xl font-bold text-blue-600 mb-4">฿${p.price.toLocaleString()}</div>
                        <div class="flex items-center justify-between mt-4 border-t pt-4">
                            <a href="${p.link}" target="_blank" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-3 rounded font-medium">🛒 ดูที่ร้าน</a>
                            <label class="flex items-center cursor-pointer">
                                <div class="relative">
                                    <input type="checkbox" class="sr-only" onchange="window.toggleBuy(${p.id})" ${p.bought ? 'checked' : ''}>
                                    <div class="block w-10 h-6 rounded-full transition-colors ${p.bought ? 'bg-green-500' : 'bg-gray-300'}"></div>
                                    <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 shadow-sm ${p.bought ? 'translate-x-4' : ''}"></div>
                                </div>
                                <span class="ml-2 text-xs font-medium w-12 text-right ${p.bought ? 'text-green-600' : 'text-gray-500'}">${p.bought ? 'ซื้อแล้ว' : 'ยังไม่ซื้อ'}</span>
                            </label>
                        </div>
                    </div>
                `;
                productListEl.appendChild(card);
            });
            updateTotals();
        }

        async function fetchImagesDynamically() {
            if(!products) return;
            for (const p of products) {
                const imgEl = document.getElementById(`img-${p.id}`);
                const loadingEl = document.getElementById(`loading-${p.id}`);
                if (!imgEl || !loadingEl) continue;

                if (p.fixedImage) {
                    imgEl.src = p.fixedImage;
                    imgEl.onload = () => { loadingEl.classList.add('hidden'); imgEl.classList.remove('hidden'); };
                    continue; 
                }

                if (p.link && p.link !== "#") {
                    try {
                        const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(p.link)}`);
                        const data = await response.json();
                        imgEl.src = (data.status === 'success' && data.data.image && data.data.image.url) ? data.data.image.url : `https://placehold.co/400x300/f1f5f9/64748b?text=No+Image`;
                    } catch (error) {
                        imgEl.src = `https://placehold.co/400x300/fee2e2/ef4444?text=Error`;
                    }
                } else { imgEl.src = `https://placehold.co/400x300/f1f5f9/64748b?text=No+Link`; }

                imgEl.onload = () => { loadingEl.classList.add('hidden'); imgEl.classList.remove('hidden'); };
                imgEl.onerror = () => { imgEl.src = `https://placehold.co/400x300/f1f5f9/64748b?text=Image+Error`; loadingEl.classList.add('hidden'); imgEl.classList.remove('hidden'); }
                await new Promise(r => setTimeout(r, 200));
            }
        }
    </script>
