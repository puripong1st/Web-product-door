<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการอุปกรณ์โปรเจกต์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .animate-pulse-fast { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .toast-enter { transform: translateX(100%); opacity: 0; }
        .toast-enter-active { transform: translateX(0); opacity: 1; transition: all 0.3s ease-out; }
        .toast-leave { transform: translateX(0); opacity: 1; }
        .toast-leave-active { transform: translateX(100%); opacity: 0; transition: all 0.3s ease-in; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-28">

    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2"></div>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-4 md:mb-0">รายการสั่งซื้ออุปกรณ์ (Hardware Checklist)</h1>
            <button onclick="window.exportPDF()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg shadow font-medium flex items-center transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                โหลดสรุป PDF
            </button>
        </div>
        
        <!-- ส่วนฟอร์มเพิ่ม/แก้ไข สินค้า -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8" id="formSection">
            <h2 class="text-lg font-semibold mb-4 text-gray-700" id="formTitle">➕ เพิ่มอุปกรณ์ใหม่</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <input type="text" id="newName" placeholder="ชื่ออุปกรณ์ *" class="lg:col-span-2 border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="newPrice" placeholder="ราคา/ชิ้น *" class="border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="newQty" placeholder="จำนวน *" value="1" min="1" class="border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="newLink" placeholder="ลิงก์ร้านค้า (ถ้ามี)" class="lg:col-span-2 border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="newImage" placeholder="ลิงก์รูปโดยตรง (ถ้ามี)" class="lg:col-span-3 border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mt-4 flex justify-between items-center">
                <span class="text-sm text-blue-500 font-medium" id="status-text">🟡 กำลังเชื่อมต่อกับ Firebase...</span>
                <div class="flex gap-2">
                    <button id="cancelEditBtn" onclick="window.cancelEdit()" class="hidden bg-gray-400 hover:bg-gray-500 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-sm">ยกเลิก</button>
                    <button id="saveBtn" onclick="window.saveProduct()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors shadow-sm">เพิ่มเข้ารายการ</button>
                </div>
            </div>
        </div>

        <!-- 🌟 ส่วนใหม่: ข้อมูลบัญชีและระบบคำนวณเงิน 🌟 -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8 flex flex-col md:flex-row gap-6 items-center justify-between">
            
            <!-- บัญชีธนาคาร -->
            <div class="flex items-center gap-4 w-full md:w-1/2 p-4 bg-sky-50 rounded-lg border border-sky-100">
                <!-- โลโก้กรุงไทย -->
                <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-sm p-1">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Krung_Thai_Bank_logo.svg/512px-Krung_Thai_Bank_logo.svg.png" alt="KTB Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <div class="font-semibold text-sky-900">ธนาคารกรุงไทย (KTB)</div>
                    <div class="text-sm text-sky-800">นาย ภูริพงศ์ แก่นกุล</div>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-lg font-bold text-sky-700 font-mono tracking-wider">198-0-73756-8</span>
                        <button onclick="window.copyAccount()" class="bg-white hover:bg-sky-100 text-sky-600 border border-sky-200 px-2 py-1 rounded text-xs flex items-center transition-colors shadow-sm" title="คัดลอกเลขบัญชี">
                            📋 คัดลอก
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- คำนวณหารค่าใช้จ่าย -->
            <div class="w-full md:w-1/2 bg-red-50 p-4 rounded-lg border border-red-100 flex flex-col items-center justify-center">
                <div class="text-sm text-red-800 mb-2 font-medium">🧮 คำนวณยอดที่ต้องจ่ายเพิ่ม</div>
                <div class="flex items-center gap-3">
                    <span class="text-gray-700">หารกัน</span>
                    <input type="number" id="splitCount" min="1" value="3" class="w-20 p-1.5 text-center border border-gray-300 rounded focus:ring-2 focus:ring-red-400 focus:outline-none" oninput="window.calculateSplit()">
                    <span class="text-gray-700">คน</span>
                </div>
                <div class="mt-2 text-lg text-gray-800">
                    ตกคนละ: <span id="splitResult" class="font-bold text-red-600 text-2xl ml-1">0</span> <span class="text-base text-red-600">บาท</span>
                </div>
            </div>
        </div>
        
        <div id="productList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- สินค้าจะถูก Render ที่นี่ -->
        </div>
    </div>

    <!-- แถบสรุปราคาด้านล่าง -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] border-t border-gray-200 py-4 px-6 z-50">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-lg">
                <span>ราคารวม: </span><span id="totalBudget" class="font-bold text-gray-800">0</span> <span>บาท</span>
            </div>
            <div class="text-lg">
                <span>ซื้อไปแล้ว: </span><span id="totalBought" class="font-bold text-green-600">0</span> <span>บาท</span>
            </div>
            <div class="text-xl">
                <span>ต้องจ่ายเพิ่ม: </span><span id="totalRemaining" class="font-bold text-red-600">0</span> <span>บาท</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        const DISCORD_WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL_HERE";

        const firebaseConfig = {
            apiKey: "AIzaSyAD9BCcPzh_umMQyjLyNlGDLglolN8Hil8",
            authDomain: "web-produtcs.firebaseapp.com",
            projectId: "web-produtcs",
            storageBucket: "web-produtcs.firebasestorage.app",
            messagingSenderId: "631567218716",
            appId: "1:631567218716:web:ffe54bbae5c02272b9c7d9",
            measurementId: "G-XP37QRT9R9",
            databaseURL: "https://web-produtcs-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'hardwareProject/products');

        let products = [];
        let editingId = null; 
        const productListEl = document.getElementById('productList');
        const statusIndicator = document.getElementById('status-text');

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            toast.className = `${bgColor} text-white px-6 py-3 rounded shadow-lg flex items-center gap-2 toast-enter`;
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            }, 10);

            setTimeout(() => {
                toast.classList.replace('toast-enter-active', 'toast-leave');
                toast.classList.add('toast-leave-active');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // 🌟 ฟังก์ชันคัดลอกเลขบัญชี 🌟
        window.copyAccount = function() {
            // ใช้เลขติดกันเพื่อให้แอปธนาคารอ่านง่าย
            navigator.clipboard.writeText("1980737568").then(() => {
                window.showToast("คัดลอกเลขบัญชี 198-0-73756-8 แล้ว!", "success");
            }).catch(err => {
                window.showToast("ไม่สามารถคัดลอกได้", "error");
            });
        }

        // 🌟 ฟังก์ชันคำนวณคนหาร 🌟
        window.calculateSplit = function() {
            const remainingText = document.getElementById('totalRemaining').innerText.replace(/,/g, '');
            const remaining = parseFloat(remainingText) || 0;
            let splitCount = parseInt(document.getElementById('splitCount').value);
            
            if (isNaN(splitCount) || splitCount < 1) splitCount = 1;
            
            const perPerson = remaining / splitCount;
            document.getElementById('splitResult').innerText = perPerson.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function sendDiscordNotification(action, product) {
            if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL === "YOUR_DISCORD_WEBHOOK_URL_HERE") return;

            const qty = product.qty || 1;
            const totalPrice = product.price * qty;

            let color = 3447003; 
            let title = "";
            let description = `**รายการ:** ${product.name}\n**จำนวน:** ${qty} ชิ้น\n**ราคารวม:** ฿${totalPrice.toLocaleString()}`;

            if (action === 'add') {
                color = 5763719; title = "➕ เพิ่มอุปกรณ์ใหม่เข้าระบบ";
                if (product.link && product.link !== "#") description += `\n**ลิงก์:** [คลิกดูร้านค้า](${product.link})`;
            } else if (action === 'edit') {
                color = 16766720; title = "✏️ มีการแก้ไขข้อมูลอุปกรณ์";
            } else if (action === 'delete') {
                color = 15548997; title = "🗑️ ลบอุปกรณ์ออกจากระบบ";
            } else if (action === 'buy') {
                color = product.bought ? 5763719 : 16705372;
                title = product.bought ? "✅ ทำรายการซื้ออุปกรณ์แล้ว!" : "⚠️ ยกเลิกสถานะการซื้ออุปกรณ์";
            }

            const payload = {
                username: "Hardware Bot",
                embeds: [{ title, description, color, timestamp: new Date().toISOString() }]
            };

            fetch(DISCORD_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).catch(e => console.log(e));
        }

        function syncToFirebase(data) { set(dbRef, data); }

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                products = data;
                statusIndicator.innerText = "🟢 เชื่อมต่อข้อมูลล่าสุดเรียบร้อย";
                statusIndicator.className = "text-sm text-green-600 font-medium";
            } else {
                products = []; 
                statusIndicator.innerText = "🟢 เชื่อมต่อสำเร็จ (ไม่มีข้อมูล)";
            }
            initRender();
            fetchImagesDynamically();
        });

        window.saveProduct = function() {
            const name = document.getElementById('newName').value.trim();
            const price = parseFloat(document.getElementById('newPrice').value);
            const qty = parseInt(document.getElementById('newQty').value) || 1;
            const link = document.getElementById('newLink').value.trim() || "#";
            const image = document.getElementById('newImage').value.trim();

            if (!name || isNaN(price) || isNaN(qty) || qty < 1) {
                window.showToast("กรุณากรอกชื่อ, ราคา และจำนวนให้ถูกต้อง", "error");
                return;
            }

            if (editingId) {
                const index = products.findIndex(p => p.id === editingId);
                if (index !== -1) {
                    const oldBoughtStatus = products[index].bought;
                    products[index] = { id: editingId, name, price, qty, link, bought: oldBoughtStatus };
                    if (image) products[index].fixedImage = image;
                    syncToFirebase(products);
                    sendDiscordNotification('edit', products[index]);
                    window.showToast("อัปเดตข้อมูลเรียบร้อย", "success");
                }
                window.cancelEdit();
            } else {
                const newProduct = { id: Date.now(), name, price, qty, link, bought: false };
                if (image) newProduct.fixedImage = image;
                let currentProducts = products || [];
                currentProducts.push(newProduct);
                syncToFirebase(currentProducts);
                sendDiscordNotification('add', newProduct);
                window.showToast("เพิ่มอุปกรณ์ใหม่แล้ว", "success");
                
                document.getElementById('newName').value = ''; 
                document.getElementById('newPrice').value = ''; 
                document.getElementById('newQty').value = '1'; 
                document.getElementById('newLink').value = ''; 
                document.getElementById('newImage').value = '';
            }
        };

        window.editProduct = function(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('newName').value = product.name;
            document.getElementById('newPrice').value = product.price;
            document.getElementById('newQty').value = product.qty || 1;
            document.getElementById('newLink').value = product.link === "#" ? "" : product.link;
            document.getElementById('newImage').value = product.fixedImage || "";

            editingId = id;
            document.getElementById('formTitle').innerText = "✏️ แก้ไขข้อมูลอุปกรณ์";
            document.getElementById('saveBtn').innerText = "บันทึกการแก้ไข";
            document.getElementById('saveBtn').className = "bg-orange-500 hover:bg-orange-600 text-white font-medium py-2.5 px-6 rounded-lg transition-colors shadow-sm";
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
            window.showToast("เข้าสู่โหมดแก้ไข", "info");
        };

        window.cancelEdit = function() {
            editingId = null;
            document.getElementById('formTitle').innerText = "➕ เพิ่มอุปกรณ์ใหม่";
            document.getElementById('saveBtn').innerText = "เพิ่มเข้ารายการ";
            document.getElementById('saveBtn').className = "bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors shadow-sm";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            
            document.getElementById('newName').value = ''; 
            document.getElementById('newPrice').value = ''; 
            document.getElementById('newQty').value = '1'; 
            document.getElementById('newLink').value = ''; 
            document.getElementById('newImage').value = '';
        }

        window.deleteProduct = function(id) {
            const pin = prompt("🔒 กรุณาใส่รหัสความปลอดภัย 4 หลัก เพื่อลบข้อมูล:");
            
            if (pin === null) return; 
            
            if (pin === "2548") {
                const productToDelete = products.find(p => p.id === id);
                const updatedProducts = products.filter(p => p.id !== id);
                syncToFirebase(updatedProducts);
                if(productToDelete) sendDiscordNotification('delete', productToDelete);
                window.showToast("ลบอุปกรณ์เรียบร้อย", "success");
            } else {
                window.showToast("รหัส PIN ไม่ถูกต้อง ไม่สามารถลบได้!", "error");
            }
        };

        window.toggleBuy = function(id) {
            const updatedProducts = [...products];
            const index = updatedProducts.findIndex(p => p.id === id);
            if (index !== -1) {
                updatedProducts[index].bought = !updatedProducts[index].bought;
                syncToFirebase(updatedProducts); 
                sendDiscordNotification('buy', updatedProducts[index]);
            }
        };

        function updateTotals() {
            let totalBudget = 0; let totalBought = 0;
            if(products && products.length > 0) {
                products.forEach(p => {
                    const qty = p.qty || 1;
                    const itemTotal = p.price * qty;
                    totalBudget += itemTotal;
                    if (p.bought) totalBought += itemTotal;
                });
            }
            document.getElementById('totalBudget').innerText = totalBudget.toLocaleString();
            document.getElementById('totalBought').innerText = totalBought.toLocaleString();
            document.getElementById('totalRemaining').innerText = (totalBudget - totalBought).toLocaleString();
            
            // เรียกฟังก์ชันคำนวณหารอัตโนมัติเมื่อยอดเปลี่ยน
            window.calculateSplit();
        }

        function initRender() {
            productListEl.innerHTML = '';
            if(!products || products.length === 0) return;
            
            products.forEach(p => {
                const card = document.createElement('div');
                card.id = `card-${p.id}`;
                const isBoughtBg = p.bought ? 'opacity-60 bg-green-50' : '';
                const qty = p.qty || 1;
                const totalPrice = p.price * qty;

                card.className = `bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 transition-all duration-300 hover:shadow-lg relative group ${isBoughtBg}`;
                
                card.innerHTML = `
                    <div class="absolute top-2 right-2 z-20 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="window.editProduct(${p.id})" class="bg-orange-500 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-orange-600 shadow" title="แก้ไข">✏️</button>
                        <button onclick="window.deleteProduct(${p.id})" class="bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-red-600 shadow" title="ลบ">✕</button>
                    </div>
                    <div class="h-48 overflow-hidden relative bg-white border-b">
                        <div id="loading-${p.id}" class="w-full h-full flex items-center justify-center animate-pulse-fast bg-gray-100 text-gray-400">กำลังดึงภาพ...</div>
                        <img id="img-${p.id}" src="" alt="${p.name}" class="w-full h-full object-contain p-2 hidden">
                        <div id="overlay-${p.id}" class="${p.bought ? '' : 'hidden'} absolute inset-0 bg-green-500 bg-opacity-20 flex items-center justify-center z-10">
                            <span class="bg-green-600 text-white px-3 py-1 rounded-full text-sm font-semibold shadow">ซื้อแล้ว</span>
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="font-semibold text-gray-800 line-clamp-2 h-12 mb-2 leading-tight">${p.name}</h3>
                        <div class="flex items-end gap-2 mb-4">
                            <div class="text-xl font-bold text-blue-600">฿${totalPrice.toLocaleString()}</div>
                            <div class="text-xs text-gray-500 mb-1">(${qty} ชิ้น)</div>
                        </div>
                        <div class="flex items-center justify-between mt-4 border-t pt-4">
                            <a href="${p.link}" target="_blank" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-3 rounded font-medium">🛒 ดูร้านค้า</a>
                            <label class="flex items-center cursor-pointer">
                                <div class="relative">
                                    <input type="checkbox" class="sr-only" onchange="window.toggleBuy(${p.id})" ${p.bought ? 'checked' : ''}>
                                    <div class="block w-10 h-6 rounded-full transition-colors ${p.bought ? 'bg-green-500' : 'bg-gray-300'}"></div>
                                    <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 shadow-sm ${p.bought ? 'translate-x-4' : ''}"></div>
                                </div>
                                <span class="ml-2 text-xs font-medium w-12 text-right ${p.bought ? 'text-green-600' : 'text-gray-500'}">${p.bought ? 'ซื้อแล้ว' : 'ยังไม่ซื้อ'}</span>
                            </label>
                        </div>
                    </div>
                `;
                productListEl.appendChild(card);
            });
            updateTotals();
        }

        async function fetchImagesDynamically() {
            if(!products || products.length === 0) return;
            for (const p of products) {
                const imgEl = document.getElementById(`img-${p.id}`);
                const loadingEl = document.getElementById(`loading-${p.id}`);
                if (!imgEl || !loadingEl) continue;

                if (p.fixedImage) {
                    imgEl.src = p.fixedImage;
                    imgEl.onload = () => { loadingEl.classList.add('hidden'); imgEl.classList.remove('hidden'); };
                    continue; 
                }
                if (p.link && p.link !== "#") {
                    try {
                        const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(p.link)}`);
                        const data = await response.json();
                        imgEl.src = (data.status === 'success' && data.data.image && data.data.image.url) ? data.data.image.url : `https://placehold.co/400x300/f1f5f9/64748b?text=No+Image`;
                    } catch (error) { imgEl.src = `https://placehold.co/400x300/fee2e2/ef4444?text=Error`; }
                } else { imgEl.src = `https://placehold.co/400x300/f1f5f9/64748b?text=No+Link`; }

                imgEl.onload = () => { loadingEl.classList.add('hidden'); imgEl.classList.remove('hidden'); };
                imgEl.onerror = () => { imgEl.src = `https://placehold.co/400x300/f1f5f9/64748b?text=Image+Error`; loadingEl.classList.add('hidden'); imgEl.classList.remove('hidden'); }
                await new Promise(r => setTimeout(r, 200));
            }
        }

        window.exportPDF = function() {
            window.showToast("กำลังประมวลผล PDF กรุณารอสักครู่...", "info");
            
            let tableHTML = `
                <div id="pdfContent" style="padding: 30px; font-family: 'Prompt', sans-serif;">
                    <h1 style="text-align:center; color:#2563eb; font-size: 24px; margin-bottom: 20px;">สรุปรายการสั่งซื้ออุปกรณ์ IoT (Hardware Checklist)</h1>
                    <table style="width:100%; border-collapse: collapse; margin-bottom: 30px;">
                        <thead>
                            <tr style="background-color: #f3f4f6;">
                                <th style="border: 1px solid #e5e7eb; padding: 10px; text-align: left;">ชื่อรายการ</th>
                                <th style="border: 1px solid #e5e7eb; padding: 10px; text-align: center;">จำนวน</th>
                                <th style="border: 1px solid #e5e7eb; padding: 10px; text-align: right;">ราคา/ชิ้น</th>
                                <th style="border: 1px solid #e5e7eb; padding: 10px; text-align: right;">รวม</th>
                                <th style="border: 1px solid #e5e7eb; padding: 10px; text-align: center;">สถานะ</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            let total = 0; let bought = 0;
            products.forEach(p => {
                const qty = p.qty || 1;
                const sum = p.price * qty;
                total += sum;
                if(p.bought) bought += sum;
                const statusHtml = p.bought ? '<span style="color:#16a34a; font-weight:bold;">ซื้อแล้ว</span>' : '<span style="color:#dc2626;">ยังไม่ซื้อ</span>';
                
                tableHTML += `
                    <tr>
                        <td style="border: 1px solid #e5e7eb; padding: 10px;">${p.name}</td>
                        <td style="border: 1px solid #e5e7eb; padding: 10px; text-align: center;">${qty}</td>
                        <td style="border: 1px solid #e5e7eb; padding: 10px; text-align: right;">฿${p.price.toLocaleString()}</td>
                        <td style="border: 1px solid #e5e7eb; padding: 10px; text-align: right;">฿${sum.toLocaleString()}</td>
                        <td style="border: 1px solid #e5e7eb; padding: 10px; text-align: center;">${statusHtml}</td>
                    </tr>
                `;
            });

            // ดึงจำนวนคนหารไปใส่ใน PDF ด้วย
            const splitCount = parseInt(document.getElementById('splitCount').value) || 1;
            const perPerson = (total - bought) / splitCount;
            let splitHtml = '';
            if(splitCount > 1 && (total - bought) > 0) {
                splitHtml = `<p style="color: #4b5563; margin-top: 5px; font-size: 16px;"><strong>ต้องจ่ายเพิ่มตกคนละ (หาร ${splitCount}):</strong> ฿${perPerson.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>`;
            }

            tableHTML += `
                        </tbody>
                    </table>
                    <div style="text-align: right; font-size: 18px;">
                        <p><strong>งบประมาณรวมทั้งหมด:</strong> ฿${total.toLocaleString()}</p>
                        <p style="color: #16a34a; margin-top: 5px;"><strong>ยอดที่จ่ายไปแล้ว:</strong> ฿${bought.toLocaleString()}</p>
                        <p style="color: #dc2626; margin-top: 5px;"><strong>ยอดคงเหลือที่ต้องจ่าย:</strong> ฿${(total - bought).toLocaleString()}</p>
                        ${splitHtml}
                    </div>
                </div>
            `;
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = tableHTML;
            document.body.appendChild(tempDiv);

            html2pdf().set({
                margin: 10,
                filename: 'Hardware_Checklist_Summary.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(tempDiv).save().then(() => {
                document.body.removeChild(tempDiv);
                window.showToast("ดาวน์โหลด PDF สำเร็จแล้ว!", "success");
            });
        }
    </script>
</body>
</html>
